<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <rect width="1080" height="1350" fill="#f0ebe1"/>
  <rect width="1080" height="730" fill="#11110f"/>
  <rect y="1188" width="1080" height="162" fill="#a22a1f"/>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="72" y="76" fill="#d85b49" font-size="17" font-weight="700" letter-spacing="4">WEEKEND SEND-OFF / NO. 003</text>
    <text x="1008" y="77" text-anchor="end" fill="#777168" font-size="15" letter-spacing="2">FRI / SUN</text>
    <line x1="72" y1="103" x2="1008" y2="103" stroke="#f0ebe1" stroke-opacity=".18"/>

    <text x="72" y="205" fill="#f0ebe1" font-family="Georgia, Times New Roman, serif" font-size="78" letter-spacing="-2">The deadline did not</text>
    <text x="72" y="286" fill="#f0ebe1" font-family="Georgia, Times New Roman, serif" font-size="78" letter-spacing="-2">slip on <tspan fill="#d85b49" font-style="italic">Friday.</tspan></text>

    <text x="72" y="353" fill="#aaa296" font-size="24">The date was only where the failure became visible.</text>

    <g transform="translate(72 430)">
      <text x="0" y="0" fill="#777168" font-size="13" letter-spacing="2">MEETING</text>
      <text x="260" y="0" fill="#777168" font-size="13" letter-spacing="2">REPORT</text>
      <text x="520" y="0" fill="#777168" font-size="13" letter-spacing="2">TARGET</text>
      <text x="803" y="0" fill="#d85b49" font-size="13" font-weight="700" letter-spacing="2">FRIDAY</text>

      <line x1="0" y1="52" x2="190" y2="52" stroke="#f0ebe1" stroke-width="3"/>
      <circle cx="0" cy="52" r="8" fill="#f0ebe1"/>
      <circle cx="190" cy="52" r="8" fill="#f0ebe1"/>
      <line x1="212" y1="52" x2="450" y2="52" stroke="#f0ebe1" stroke-width="3"/>
      <circle cx="212" cy="52" r="9" fill="none" stroke="#d85b49" stroke-width="3"/>
      <circle cx="450" cy="52" r="8" fill="#f0ebe1"/>
      <line x1="472" y1="52" x2="710" y2="52" stroke="#f0ebe1" stroke-width="3"/>
      <circle cx="472" cy="52" r="9" fill="none" stroke="#d85b49" stroke-width="3"/>
      <circle cx="710" cy="52" r="8" fill="#f0ebe1"/>
      <line x1="732" y1="52" x2="878" y2="52" stroke="#777168" stroke-width="3" stroke-dasharray="7 9"/>
      <circle cx="732" cy="52" r="9" fill="none" stroke="#d85b49" stroke-width="3"/>
      <circle cx="878" cy="52" r="19" fill="none" stroke="#d85b49" stroke-width="3"/>
      <line x1="864" y1="38" x2="892" y2="66" stroke="#d85b49" stroke-width="3"/>
      <line x1="892" y1="38" x2="864" y2="66" stroke="#d85b49" stroke-width="3"/>

      <text x="201" y="94" text-anchor="middle" fill="#d85b49" font-size="12" font-weight="700" letter-spacing="1.7">HANDOFF</text>
      <text x="461" y="94" text-anchor="middle" fill="#d85b49" font-size="12" font-weight="700" letter-spacing="1.7">HANDOFF</text>
      <text x="721" y="94" text-anchor="middle" fill="#d85b49" font-size="12" font-weight="700" letter-spacing="1.7">HANDOFF</text>

      <text x="0" y="153" fill="#aaa296" font-size="18">Task complete</text>
      <text x="260" y="153" fill="#aaa296" font-size="18">Task complete</text>
      <text x="520" y="153" fill="#aaa296" font-size="18">Task complete</text>
      <text x="803" y="153" fill="#d85b49" font-size="18" font-weight="700">Outcome missed</text>
    </g>

    <text x="72" y="808" fill="#171613" font-family="Georgia, Times New Roman, serif" font-size="54" font-weight="700" letter-spacing="-1">It slipped in every handoff</text>
    <text x="72" y="864" fill="#171613" font-family="Georgia, Times New Roman, serif" font-size="54" font-weight="700" letter-spacing="-1">beforehand.</text>

    <text x="72" y="925" fill="#171613" font-size="24">No one missed the meeting.</text>
    <text x="72" y="963" fill="#171613" font-size="24">No one missed the report.</text>
    <text x="72" y="1001" fill="#171613" font-size="24">No one missed their own target.</text>
    <text x="72" y="1065" fill="#a22a1f" font-size="35" font-weight="700">They only missed each other.</text>

    <text x="72" y="1128" fill="#171613" font-size="20">Enough business for one week.</text>
    <text x="72" y="1158" fill="#171613" font-size="20">Monday will still be waiting for an owner.</text>

    <text x="72" y="1242" fill="#f0ebe1" font-size="27" font-weight="700" letter-spacing="5">KIT55 SOMA</text>
    <text x="72" y="1282" fill="#f0ebe1" font-size="17">Organizational engineering for fragmented ecosystems.</text>
    <text x="72" y="1319" fill="#f0ebe1" font-size="16">kit55soma.com</text>

    <text x="1008" y="1242" text-anchor="end" fill="#f0ebe1" font-size="18" font-weight="700">THE CALENDAR TOOK THE BLAME.</text>
    <text x="1008" y="1276" text-anchor="end" fill="#11110f" font-size="18" font-weight="700">THE OPERATING MODEL EARNED IT.</text>
    <text x="1008" y="1319" text-anchor="end" fill="#f0ebe1" font-size="15">#OrganizationalEngineering  #OperationalLeadership</text>
  </g>
</svg>
