    <text x="1018" y="48" text-anchor="end" fill="#b58a45" font-size="15" font-weight="700" letter-spacing="4">NO. 004</text>

    <text x="540" y="125" text-anchor="middle" fill="#eee8dc" font-size="66" font-weight="900" letter-spacing="-1">YOUR TEAM ISN'T</text>
    <text x="540" y="194" text-anchor="middle" fill="#eee8dc" font-size="66" font-weight="900" letter-spacing="-1">WORKING THE WEEKEND.</text>
    <text x="540" y="263" text-anchor="middle" fill="#c7a263" font-size="66" font-weight="900" letter-spacing="-1">THEY'RE SERVING</text>
    <text x="540" y="332" text-anchor="middle" fill="#c7a263" font-size="66" font-weight="900" letter-spacing="-1">YOUR INDECISION.</text>

    <line x1="300" y1="365" x2="460" y2="365" stroke="#b58a45"/>
    <text x="540" y="371" text-anchor="middle" fill="#b58a45" font-size="15" font-weight="700" letter-spacing="5">FRI / SUN</text>
    <line x1="620" y1="365" x2="780" y2="365" stroke="#b58a45"/>

    <text x="540" y="414" text-anchor="middle" fill="#e6dfd4" font-size="21">Every priority stayed urgent.</text>
    <text x="540" y="444" text-anchor="middle" fill="#e6dfd4" font-size="21">Every owner stayed optional.</text>
    <text x="540" y="474" text-anchor="middle" fill="#e6dfd4" font-size="21">Every conflict stayed unresolved.</text>
    <text x="540" y="514" text-anchor="middle" fill="#e6dfd4" font-size="21">So the calendar became the escalation plan.</text>

    <!-- Empty executive boardroom -->
    <rect x="72" y="550" width="936" height="175" rx="2" fill="#171713" stroke="#544936"/>
    <rect x="72" y="550" width="936" height="6" fill="#c7a263" opacity=".72"/>
    <rect x="284" y="630" width="512" height="38" rx="19" fill="#292721"/>
    <line x1="314" y1="668" x2="300" y2="706" stroke="#6c6558" stroke-width="7"/>
    <line x1="766" y1="668" x2="780" y2="706" stroke="#6c6558" stroke-width="7"/>
    <g fill="#24231f" stroke="#514d44">
      <rect x="240" y="584" width="55" height="58" rx="7"/>
      <rect x="344" y="584" width="55" height="58" rx="7"/>
      <rect x="447" y="584" width="55" height="58" rx="7"/>
      <rect x="578" y="584" width="55" height="58" rx="7"/>
      <rect x="681" y="584" width="55" height="58" rx="7"/>
      <rect x="785" y="584" width="55" height="58" rx="7"/>
    </g>
    <text x="96" y="586" fill="#8c8477" font-size="13" letter-spacing="3">EXECUTIVE LEVEL / LIGHTS OUT</text>

