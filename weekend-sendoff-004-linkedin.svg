<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070807"/>
      <stop offset=".58" stop-color="#10100e"/>
      <stop offset="1" stop-color="#080806"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#55150f"/>
      <stop offset=".55" stop-color="#27100d"/>
      <stop offset="1" stop-color="#100a08"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="12"/></filter>
    <pattern id="grain" width="90" height="90" patternUnits="userSpaceOnUse">
      <circle cx="11" cy="20" r="1" fill="#fff" opacity=".025"/>
      <circle cx="62" cy="53" r="1" fill="#fff" opacity=".018"/>
      <circle cx="35" cy="78" r=".8" fill="#fff" opacity=".02"/>
    </pattern>
  </defs>

  <rect width="1080" height="1350" fill="url(#bg)"/>
  <rect width="1080" height="1350" fill="url(#grain)"/>

  <g font-family="Arial, Helvetica, sans-serif">
