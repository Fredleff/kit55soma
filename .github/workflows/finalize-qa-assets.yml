name: Finalize rendered QA assets

on:
  pull_request:
    types: [synchronize]
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'commercial-editorial-front-door' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out the review branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Patch sharing metadata and article contrast
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              "index.html": (
                  '  <meta property="og:image" content="https://kit55soma.com/social-card.svg">',
                  '  <meta property="og:image" content="https://kit55soma.com/social-card.png">\n'
                  '  <meta property="og:image:width" content="1200">\n'
                  '  <meta property="og:image:height" content="627">\n'
                  '  <meta property="og:image:alt" content="KIT55 Soma — Bring us the outcome no one fully owns.">'
              ),
              "fault-lines.html": (
                  '  <meta property="og:image" content="https://kit55soma.com/social-card.svg">',
                  '  <meta property="og:image" content="https://kit55soma.com/fault-lines-card.png">\n'
                  '  <meta property="og:image:width" content="1200">\n'
                  '  <meta property="og:image:height" content="627">\n'
                  '  <meta property="og:image:alt" content="Fault Lines by KIT55 Soma — Where everyone can be right and the outcome still fails.">'
              ),
              "fault-lines/modular-construction-silos.html": (
                  '  <meta property="og:image" content="https://kit55soma.com/social-card.svg">',
                  '  <meta property="og:image" content="https://kit55soma.com/fault-lines-001-modular.png">\n'
                  '  <meta property="og:image:width" content="1200">\n'
                  '  <meta property="og:image:height" content="627">\n'
                  '  <meta property="og:image:alt" content="Fault Lines 001 — Does modular construction eliminate the silos or move the fault line?">'
              ),
          }

          for filename, (old, new) in replacements.items():
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              if new not in text:
                  if old not in text:
                      raise SystemExit(f"Expected Open Graph image marker not found in {filename}")
                  text = text.replace(old, new, 1)
              if filename != "index.html" and 'name="twitter:card"' not in text:
                  anchor = new
                  text = text.replace(anchor, anchor + '\n  <meta name="twitter:card" content="summary_large_image">', 1)
              path.write_text(text, encoding="utf-8")

          css = Path("front-door.css")
          text = css.read_text(encoding="utf-8")
          rule = ".article-header { color: var(--paper); }"
          if rule not in text:
              marker = "/* Fault Line article */"
              if marker not in text:
                  raise SystemExit("Article CSS marker not found")
              text = text.replace(marker, marker + "\n" + rule, 1)
              css.write_text(text, encoding="utf-8")

      - name: Install SVG renderer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin

      - name: Build LinkedIn preview cards
        shell: python
        run: |
          from pathlib import Path

          def card(path, eyebrow, lines, footer, accent_line=2, headline_size=78):
              y = 252
              text_lines = []
              for index, line in enumerate(lines):
                  fill = "#d85b49" if index == accent_line else "#f0ebe1"
                  text_lines.append(
                      f'<text x="84" y="{y}" fill="{fill}" font-family="DejaVu Serif, Georgia, serif" '
                      f'font-size="{headline_size}" font-weight="400" letter-spacing="-2">{line}</text>'
                  )
                  y += headline_size + 8

              svg = f'''<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="627" viewBox="0 0 1200 627">
                <rect width="1200" height="627" fill="#11110f"/>
                <path d="M895 -40 L1055 690" stroke="#2c2925" stroke-width="2"/>
                <path d="M915 -40 L1075 690" stroke="#a22a1f" stroke-width="7" opacity=".9"/>
                <g transform="translate(84 68)" fill="none" stroke="#f0ebe1" stroke-width="4" stroke-linecap="round" opacity=".92">
                  <path d="M0 0c55 0 68 45 104 80M0 48c54 0 70 25 104 50M0 96h104M0 144c54 0 70-25 104-50M0 192c55 0 68-45 104-80"/>
                  <circle cx="139" cy="96" r="33"/>
                  <path d="M172 96h70"/>
                  <circle cx="242" cy="96" r="8" fill="#d85b49" stroke="#d85b49"/>
                </g>
                <text x="365" y="112" fill="#f0ebe1" font-family="DejaVu Serif, Georgia, serif" font-size="54" letter-spacing="5">KIT55</text>
                <text x="370" y="153" fill="#9f988c" font-family="DejaVu Sans Mono, monospace" font-size="18" letter-spacing="16">SOMA</text>
                <text x="84" y="210" fill="#d85b49" font-family="DejaVu Sans Mono, monospace" font-size="20" letter-spacing="4">{eyebrow}</text>
                {''.join(text_lines)}
                <line x1="84" y1="556" x2="1116" y2="556" stroke="#4b4842"/>
                <text x="84" y="594" fill="#bdb5a8" font-family="DejaVu Sans Mono, monospace" font-size="17" letter-spacing="2">{footer}</text>
              </svg>'''
              Path(path).write_text(svg, encoding="utf-8")

          card(
              "social-card.tmp.svg",
              "OPERATIONAL OWNERSHIP FOR FRAGMENTED ENTERPRISES",
              ["BRING US THE OUTCOME", "NO ONE FULLY OWNS."],
              "ADVISE IT · DESIGN IT · FIX IT · RUN IT · TAKE IT OVER",
              accent_line=1,
              headline_size=80,
          )
          card(
              "fault-lines-card.tmp.svg",
              "KIT55 SOMA EDITORIAL",
              ["FAULT", "LINES."],
              "RESPECT THE SPECIALIST · EXPOSE THE SYSTEM · PROTECT THE ENTERPRISE OUTCOME",
              accent_line=1,
              headline_size=112,
          )
          card(
              "fault-lines-001-modular.tmp.svg",
              "FAULT LINES / DISPATCH 001 / CONSTRUCTION · MODULAR",
              ["DOES MODULAR CONSTRUCTION", "ELIMINATE THE SILOS—OR", "MOVE THE FAULT LINE?"],
              "THE FACTORY MAY MOVE THE FAULT LINE. IT DOES NOT REMOVE THE NEED TO OWN IT.",
              accent_line=2,
              headline_size=58,
          )

      - name: Render and validate cards
        run: |
          rsvg-convert -w 1200 -h 627 social-card.tmp.svg -o social-card.png
          rsvg-convert -w 1200 -h 627 fault-lines-card.tmp.svg -o fault-lines-card.png
          rsvg-convert -w 1200 -h 627 fault-lines-001-modular.tmp.svg -o fault-lines-001-modular.png
          python - <<'PY'
          from pathlib import Path
          import struct

          for filename in ("social-card.png", "fault-lines-card.png", "fault-lines-001-modular.png"):
              data = Path(filename).read_bytes()
              if data[:8] != b"\x89PNG\r\n\x1a\n":
                  raise SystemExit(f"{filename} is not a PNG")
              width, height = struct.unpack(">II", data[16:24])
              if (width, height) != (1200, 627):
                  raise SystemExit(f"{filename} is {width}x{height}, expected 1200x627")
              print(filename, width, height, len(data))
          PY
          rm -f *.tmp.svg

      - name: Commit the final QA pass
        run: |
          rm -f .github/workflows/finalize-qa-assets.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name "KIT55 QA Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Complete rendered QA and add social preview cards"
          git push origin HEAD:${{ github.head_ref }}
